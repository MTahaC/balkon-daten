[project]
name = "lod2pipe"
version = "0.1.0"
description = "NRW LoD2 CityGML -> building prisms -> PMTiles (build-time pipeline)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S603"]  # subprocess with a fixed argument list (tippecanoe)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is how pytest works
